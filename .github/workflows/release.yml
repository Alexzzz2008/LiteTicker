name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish, for example v2.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Alexzzz2008/LiteTicker'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RUSTUP_TOOLCHAIN: '1.96.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Verify stable native version
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\verify-native.ps1
          $version = Get-NativeVersion $PWD.ProviderPath
          if ($env:RELEASE_TAG -cne ('v' + $version)) { throw 'Release tag does not match native/Cargo.toml.' }
          git rev-parse --verify ('refs/tags/' + $env:RELEASE_TAG + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'Release requires an existing tag.' }

      - name: Install pinned Rust MSVC toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }

      - name: Build and test native Windows x64
        run: .\build.ps1 -Test

      - name: Package installer and checksums
        run: .\package.ps1

      - name: Publish native stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = Join-Path $env:RUNNER_TEMP 'liteticker-release-notes.md'
          $notes = @(
            '- 分时和分笔按报价交易日更新，开盘后不会再把昨天的走势当作今天的图。只有首个分时点时，也能看到价格、均价或上证领先点位。'
            '- 腾讯分笔翻页时会补足最近十笔。上证指数、上证 50、沪深 300 和科创 50 缺少逐笔时，盘口改为显示分钟成交。'
            '- 窗口状态和刷新频率遵循已收录的 2025、2026 年交易所休市安排。未收录年份的工作日交易时段会标为“预计交易时段”。'
            '- 分时窗口解除固定后，鼠标移出即可自动关闭。自选排序和调整透明度会保留手动设置的高度，用键盘选股或将股票置底时，选中行会滚入视野。'
            '- 全局快捷键被其他程序占用时，仍可保存自选股的添加、删除和排序。'
            '- 自动更新在后台复制和校验文件，期间窗口可继续操作。成功更新后会清理临时助手，并保留回滚备份和失败记录。'
          )
          [IO.File]::WriteAllText($notesPath, (($notes -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          $names = @('LiteTicker.exe', 'LiteTicker.exe.sha256', 'LiteTicker-win.zip', 'LiteTicker-win.zip.sha256', 'SHA256SUMS.txt')
          $files = @($names | ForEach-Object { Join-Path .\dist $_ })
          gh release create $env:RELEASE_TAG @files --repo Alexzzz2008/LiteTicker --verify-tag --title ('轻量看盘 ' + $env:RELEASE_TAG + ' 正式版') --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $releaseJson = gh api ('repos/Alexzzz2008/LiteTicker/releases/tags/' + $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0) { throw 'Published release could not be inspected.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'Published release identity is incorrect.' }
          foreach ($name in $names) {
            $assets = @($release.assets | Where-Object { $_.name -ceq $name })
            $file = Join-Path .\dist $name
            $expected = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assets.Count -ne 1 -or $assets[0].size -ne (Get-Item -LiteralPath $file).Length -or $assets[0].digest -cne $expected) { throw ('Published asset size/digest does not match: ' + $name) }
          }
